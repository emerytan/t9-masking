<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>CO3 T9 Masking</title>
    <!-- https://electronjs.org/docs/tutorial/security#csp-meta-tag -->
    <!-- <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" /> -->
    <link rel="stylesheet" href="./public/css/photon.css">
    <link rel="stylesheet" href="./public/css/styles.css">
</head>

<body>
    <div class="window">
        <header>
            <h1 id="maskingTitle" class="title">CO3 T9 Masking</h1>
        </header>
        <div class="window-content">
            <div class="pane-group">
                <div class="pane" id="maskingContainer">
                    <div id="maskingPresets">
                        <legend class="legend">Presets</legend>
                        <button id="maskingScope" class="btn btn-large btn-dark eta-button">Scope</button>
                        <button id="maskingFlat" class="btn btn-large btn-dark eta-button">Flat</button>
                    </div>
                </div>
                <div class="pane">
                    <div id="leftMasking">
                        <legend class="legend">Left side</legend>
                        <button id="leftClose" class="btn btn-large btn-dark eta-button">&lt;&lt;&lt;&lt;</button>
                        <button id="leftOpen" class="btn btn-large btn-dark eta-button">&gt;&gt;&gt;&gt;</button>
                    </div>
                </div>
                <div class="pane">
                    <div id="rightMasking">
                        <legend class="legend">Right side</legend>
                        <button id="rightClose" class="btn btn-large btn-dark eta-button">&lt;&lt;&lt;&lt;</button>
                        <button id="rightOpen" class="btn btn-large btn-dark eta-button">&gt;&gt;&gt;&gt;</button>
                    </div>
                </div>
                <div class="pane">
                    <div id="bottomMasking">
                        <legend class="legend">Bottom</legend>
                        <button id="bottomRaise" class="btn btn-large btn-dark eta-button">Raise</button>
                        <button id="bottomLower" class="btn btn-large btn-dark eta-button">Lower</button>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <h1 id="appState" class="title">Footer</h1>
            <h1 id="serverMessages" class="title">Messages</h1>
        </footer>
    </div>
    <div id="connectionDialog" class="connection-dialog" role="dialog" aria-modal="true" aria-labelledby="connectionTitle" hidden>
        <form id="connectionForm" class="connection-panel">
            <h2 id="connectionTitle">Connect to CVM masking system</h2>
            <p>A successful ping and TCP port 23 check saves this address for future startups.</p>
            <label for="cvmAddress">IPv4 address</label>
            <input id="cvmAddress" name="address" type="text" inputmode="decimal" placeholder="192.168.1.10" autocomplete="off" required>
            <p id="connectionFeedback" role="status" aria-live="polite"></p>
            <div class="connection-actions">
                <button id="cancelConnection" type="button" class="modal-button">Cancel</button>
                <button id="submitConnection" type="submit" class="modal-button primary">Connect</button>
            </div>
        </form>
    </div>
    <script>
        require('./js/app.js')
    </script>
</body>

</html>
